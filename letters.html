<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="letters.css" />
    <title>Birthdayyayy</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="back" href="index.html">Back</a>
      </div>
    </header>

    <main class="page">
      <section class="letters" aria-label="Birthday letters">
        <article class="letter letter--image" aria-label="Hogwarts acceptance letter image">
          <img
            class="hogwarts__scan"
            src="./Assets/Graphics/hogwarts-letter.png"
            alt="Hogwarts acceptance letter"
          />
        </article>

        <article class="letter" aria-label="Locked personal letter">
          <h2 class="letter__title">A Letter From Shreyansh</h2>
          <div class="letter__meta">
            <div>Status: <span class="ink">Locked</span></div>
            <div>Password required to open</div>
          </div>

          <div class="rule"></div>

          <p>
            A private note is sealed inside this envelope. Tap below and enter the password to reveal it.
          </p>

          <a class="open-letter-btn" href="shreyansh-letter.html">Open the letter</a>
        </article>
      </section>
    </main>
  </body>
</html>
